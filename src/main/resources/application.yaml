spring:
  application:
    name: order-service
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  datasource:
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # loads items of a page of orders in a few queries instead of one query per order
        default_batch_fetch_size: 50
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    web:
      pageable:
        max-page-size: 100
server:
  port: ${SERVER_PORT:8082}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:auth-service}

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8080}
  connect-timeout: ${USER_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${USER_SERVICE_READ_TIMEOUT:3s}

resilience4j:
  circuitbreaker:
    instances:
      userService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${USER_SERVICE_CB_OPEN_DURATION:10s}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # answers of a healthy user-service, they must not open the circuit
        ignore-exceptions:
          - by.darkimpulsepoint.orderservice.exception.UserNotFoundException
          - org.springframework.security.access.AccessDeniedException
