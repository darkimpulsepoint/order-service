databaseChangeLog:
  - changeSet:
      id: 002-create-orders-table
      author: order-service
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_orders
              # id of the user in user-service, another database, so there is no foreign key
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: NUMERIC(14, 2)
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - sql:
            sql: >
              ALTER TABLE orders ADD CONSTRAINT chk_orders_status
              CHECK (status IN ('NEW', 'PROCESSING', 'SHIPPED', 'DELIVERED', 'CANCELLED'))

        - sql:
            sql: ALTER TABLE orders ADD CONSTRAINT chk_orders_total_price CHECK (total_price >= 0)

        # orders of a user, newest first
        - createIndex:
            tableName: orders
            indexName: idx_orders_user_id_created_at
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at

        # filter by statuses and creation date range
        - createIndex:
            tableName: orders
            indexName: idx_orders_status_created_at
            columns:
              - column:
                  name: status
              - column:
                  name: created_at

        - createIndex:
            tableName: orders
            indexName: idx_orders_created_at
            columns:
              - column:
                  name: created_at
