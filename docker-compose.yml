services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-order_service}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-order_service}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: order-service:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-order_service}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set and shared with auth-service and user-service}
      # user-service runs from its own compose file and publishes port 8080 on the host
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SERVER_PORT:-8082}:8082"

volumes:
  order-postgres-data:
